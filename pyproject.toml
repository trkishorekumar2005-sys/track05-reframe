[project]
name = "reframe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kishore", email = "trkishorekumar2005@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "mediapipe>=1.0.1",
    "numpy>=2.4.6",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "typer>=0.27.2",
    "webrtcvad-wheels>=2.0.14",
]

[project.scripts]
reframe = "reframe.cli:app"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
]
